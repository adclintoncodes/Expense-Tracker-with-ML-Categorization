services:
  # Full stack in one container (SPA + API + SQLite). Preferred for simple deploys.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: sqlite:////app/data/expenses.db
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      FRONTEND_DIST: /app/static
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    networks:
      - expense-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Split mode (optional): API + nginx SPA with /api proxy
  backend:
    profiles: ["split"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-tracker-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: sqlite:////app/data/expenses.db
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    networks:
      - expense-net

  frontend:
    profiles: ["split"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: expense-tracker-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - expense-net

  retrain:
    profiles: ["retrain"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: sqlite:////app/data/expenses.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/ml/models:/app/ml/models
    command: ["python", "scripts/retrain.py"]
    networks:
      - expense-net

  train-model:
    profiles: ["train"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app/ml
    volumes:
      - ./backend/ml/models:/app/ml/models
      - ./backend/ml/data:/app/ml/data
    command: ["python", "train_model.py"]
    networks:
      - expense-net

networks:
  expense-net:
    driver: bridge
